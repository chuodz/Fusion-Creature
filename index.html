<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusion Creatures HD</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #1a1c29 url('fondo.png') no-repeat center center fixed; /* TU FONDO DE PANTALLA */
      background-size: cover;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Estilo del Caldero Principal */
    .cauldron-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    /* Estilo de los Huevos y Monstruos en el Inventario */
    .item-card img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .slot img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .inventory-grid {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .item-card {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #00e676;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🔮 Caldero de Fusión</h1>

  <!-- ZONA DEL CALDERO Y ESPACIOS -->
  <div style="display:flex; align-items:center; gap:20px; margin:20px;">
    <div id="slot1" class="slot"><p>Elige 1</p></div>
    
    <!-- AQUÍ VA LA IMAGEN DE TU CALDERO -->
    <img src="caldero.png" class="cauldron-img" alt="Caldero">
    
    <div id="slot2" class="slot"><p>Elige 2</p></div>
  </div>

  <h2>Tu Inventario de Criaturas</h2>
  <div id="inventory" class="inventory-grid">
    <!-- Aquí se cargan las imágenes PNG automáticas -->
  </div>

  <script>
    // LISTA CON LAS RUTAS A TUS IMÁGENES REALES
    const misCriaturas = [
      { name: 'Fuego', img: 'monstruo-fuego.png' },
      { name: 'Huevo Fuego', img: 'huevo-fuego.png' }
    ];

    const container = document.getElementById('inventory');

    misCriaturas.forEach(c => {
      container.innerHTML += `
        <div class="item-card">
          <img src="${c.img}" alt="${c.name}">
          <p>${c.name}</p>
        </div>
      `;
    });
  </script>
</body>
</html>
